[project]
name = "python-serialization-comparison"
version = "0.1.0"
description = "Comparison of marshmallow, marshmallow-recipe, and pydantic — performance, features, and size"
requires-python = ">=3.11"
dependencies = [
    "marshmallow>=3.20",
    "marshmallow-recipe>=0.36",
    "pydantic>=2.0",
]

[project.scripts]
bench = "bench:main"
